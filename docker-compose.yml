services:
  postgres:
    image: postgres:15-alpine
    container_name: orderflow-db
    ports:
      # 5433 no host evita conflito com PostgreSQL local na 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: orderflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d orderflow"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  postgres_data: